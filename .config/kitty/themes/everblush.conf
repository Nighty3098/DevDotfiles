# Everblush theme for Kitty terminal
# Based on color palette from https://github.com/Everblush/everblush

# Background and foreground
background #141b1e
foreground #dadada

# Selection (lighter background + slight transparency optional)
selection_background #232a2d
selection_foreground #dadada

# Black (color0) - Dark version of background+ 
# Using lighter background for better visibility
color0 #232a2d
color8 #3a4144

# Red
color1 #e57474
color9 #e57474

# Green
color2 #8ccf7e
color10 #8ccf7e

# Yellow
color3 #e5c76b
color11 #e5c76b

# Blue
color4 #67b0e8
color12 #67b0e8

# Magenta
color5 #c47fd5
color13 #c47fd5

# Cyan
color6 #6cbfbf
color14 #6cbfbf

# White (color7 - light gray)
color7 #b3b9b8
color15 #dadada

# Cursor colors
cursor #dadada
cursor_text_color #141b1e

# Active tab (optional, based on lighter background)
active_tab_background #232a2d
active_tab_foreground #dadada
inactive_tab_background #141b1e
inactive_tab_foreground #b3b9b8

# Marks (search highlights)
mark1_background #e57474
mark1_foreground #141b1e
mark2_background #8ccf7e
mark2_foreground #141b1e
mark3_background #e5c76b
mark3_foreground #141b1e
