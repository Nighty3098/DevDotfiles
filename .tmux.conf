set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"
set-option -a terminal-features 'kitty:RGB'

set -g prefix C-b

bind s choose-tree -sZ -O name

set -g base-index 1
setw -g pane-base-index 1

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key b set-option status

set -g pane-border-lines single

set-option -g status-position top

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-open'             # Open links from tmux - Select path and press o
set -g @plugin 'tmux-plugins/tmux-yank'             # Copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-sensible'         # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'vaaleyard/tmux-dotbar'

# STATUS
set -g status-style fg=white,bg=default,bold
set -g status-justify "absolute-centre"

set -g set-titles on
set -g set-titles-string '#S (#W) @ #H '

# Window list styles
set-window-option -g window-status-style "bg=default,fg=white"
set-window-option -g window-status-current-style "bg=blue,fg=black,bold"
set-window-option -g window-status-separator " "

# Format window names
set -g window-status-format ' #[fg=white]#{window_index}:#{?#{==:#W,zsh},#(echo "#{pane_current_command}"),#W} '
set -g window-status-current-format '#[bg=blue]#[fg=black] #{window_index}:#{?#{==:#W,zsh},#(echo "#{pane_current_command}"),#W} '

# Panes styling
set-option -g pane-border-style "fg=default"
set-option -g pane-active-border-style "fg=red"

# Messages
set-option -g message-style "bg=default,fg=white"

# Copy mode
set-window-option -g copy-mode-match-style "bg=green,fg=black"
set-window-option -g copy-mode-current-match-style "bg=blue,fg=black"

# Status bar left (session info)
set-option -g status-left "#[bg=red,fg=black,bold] #S #[bg=default,fg=white]"

# Status bar right (time and date)
set-option -g status-right "#[bg=red,fg=black,bold] %H:%M %Y-%m-%d "

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
